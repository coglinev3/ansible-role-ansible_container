---
# file: roles/ansible_container/tasks/setup-RedHat.yml

- name: "RedHat: Fix /etc/shadow"
  ansible.builtin.raw: chmod 0640 /etc/shadow
  changed_when: false

- name: "RHEL: Install EPEL Repository"
  become: "{{ ansible_container_become }}"
  ansible.builtin.dnf:
    name: epel-release
    state: present
    update_cache: true
  when:
    - not ansible_facts.distribution == "Fedora"
    - not ansible_facts.distribution == "Amazon"
  tags:
    - install

- name: "RedHat: Update all packages to the latest version."
  become: "{{ ansible_container_become }}"
  ansible.builtin.dnf:
    name: '*'
    update_cache: true
    state: latest # noqa package-latest
  when: ansible_container_upgrade_packages
  notify: remove yum_cache

- name: "RedHat: Install requirements."
  become: "{{ ansible_container_become }}"
  ansible.builtin.dnf:
    name: "{{ ansible_container_requirements }}"
    state: "{{ ansible_container_package_state }}"
  notify: remove yum_cache

- name: "RedHat: Prepare systemd."
  when: ansible_facts.distribution_major_version | int > 6
  block:
    - name: Delete unit files which might cause issues
      become: "{{ ansible_container_become }}"
      ansible.builtin.shell: >-
        for i in *;
        do [ $i == systemd-tmpfiles-setup.service ] || rm -f $i;
        done
      args:
        executable: /bin/bash
        chdir: /lib/systemd/system/sysinit.target.wants
      register: result
      changed_when: result.rc != 0
      failed_when: result.rc != 0

    - name: "RedHat: Define systemd unit file search paths."
      ansible.builtin.set_fact:
        systemd_unit_search_paths:
          - path: /lib/systemd/system/multi-user.target.wants
            patterns: "*"
          - path: /etc/systemd/system
            patterns: "*"
          - path: /lib/systemd/system/local-fs.target.wants
            patterns: "*"
          - path: /lib/systemd/system/sockets.target.wants
            patterns:
              - "*udev*"
              - "*initctl*"
          - path: /lib/systemd/system/basic.target.wants
            patterns: "*"
          - path: /lib/systemd/system/anaconda.target.wants
            patterns: "*"

    - name: "RedHat: Check systemd unit directories."
      become: "{{ ansible_container_become }}"
      ansible.builtin.stat:
        path: "{{ item.path }}"
      loop: "{{ systemd_unit_search_paths }}"
      register: systemd_unit_search_dirs

    - name: "RedHat: Search for unit files which might cause issues."
      become: "{{ ansible_container_become }}"
      ansible.builtin.find:
        paths: "{{ item.item.path }}"
        patterns: "{{ item.item.patterns }}"
        file_type: any
        recurse: false
      loop: "{{ systemd_unit_search_dirs.results }}"
      loop_control:
        label: "{{ item.item.path }}"
      register: systemd_unit_files
      when: item.stat.isdir | default(false)

    - name: "RedHat: Remove unnecessary systemd unit files."
      become: "{{ ansible_container_become }}"
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ systemd_unit_files.results
        | selectattr('files', 'defined')
        | map(attribute='files')
        | flatten }}"
      loop_control:
        label: "{{ item.path }}"

- name: "RedHat: Check for /lib/systemd/system directory."
  ansible.builtin.stat:
    path: /lib/systemd/system
  register: systemd_dir

- name: "RedHat: Find unnecessary getty and udev unit files."
  become: "{{ ansible_container_become }}"
  ansible.builtin.find:
    paths: /lib/systemd/system
    patterns:
      - "systemd*udev*"
      - "getty.target"
    file_type: any
  register: unnecessary_systemd_units
  when:
    - systemd_dir.stat.isdir is defined
    - systemd_dir.stat.isdir

- name: "RedHat: Remove unnecessary getty and udev unit files."
  become: "{{ ansible_container_become }}"
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ unnecessary_systemd_units.files | default([]) }}"
  loop_control:
    label: "{{ item.path }}"

- name: "RedHat: Check for /etc/rc.d/rc.sysinit."
  ansible.builtin.stat:
    path: /etc/rc.d/rc.sysinit
  register: sysinit_file

- name: "RedHat: Remove unnecessary getty and udev services that can result in high CPU usage."
  when: sysinit_file.stat.isreg is defined and sysinit_file.stat.isreg
  block:
    # Remove unnecessary getty and udev services that can result in high CPU
    # usage when using multiple containers with Molecule
    # (https://github.com/ansible/molecule/issues/1104)
    - name: "RedHat: Comment out start_udev."
      ansible.builtin.lineinfile:
        path: /etc/rc.d/rc.sysinit
        regexp: '^(.*)start_udev'
        line: '#\1start_udev'
        backrefs: "yes"
        backup: "yes"
        owner: root
        group: root
        mode: "0o755"

    - name: "RedHat: Remove unnecessary tty's."
      become: "{{ ansible_container_become }}"
      ansible.builtin.file:
        path: /etc/init/tty.conf
        state: absent
